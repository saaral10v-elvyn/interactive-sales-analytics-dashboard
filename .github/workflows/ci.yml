name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=sales_dashboard --cov=sales_api --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [quality, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t sales-dashboard:ci .

      - name: Start the container
        run: docker run -d --name sales-dashboard-ci -p 8000:8000 sales-dashboard:ci

      - name: Wait for the API health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The container did not become healthy."
          docker logs sales-dashboard-ci
          exit 1

      - name: Smoke test the served SPA and API
        run: |
          set -euo pipefail

          curl -fsS http://127.0.0.1:8000/ -o home.html
          grep -q '<div id="root"></div>' home.html

          curl -fsS http://127.0.0.1:8000/overview -o overview.html
          grep -q '<div id="root"></div>' overview.html

          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/assets/does-not-exist.js)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/does-not-exist)" = "404"

      - name: Check gzip and cache headers
        run: |
          set -euo pipefail

          asset=$(grep -o '/assets/[^"]*\.js' home.html | head -n 1)
          test -n "$asset"
          curl -fsS -H 'Accept-Encoding: gzip' -D headers.txt -o /dev/null "http://127.0.0.1:8000${asset}"
          grep -qi '^content-encoding: gzip' headers.txt
          grep -qi '^cache-control: public, max-age=31536000, immutable' headers.txt

      - name: Show container logs
        if: always()
        run: docker logs sales-dashboard-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f sales-dashboard-ci || true
