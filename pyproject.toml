[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-analytics-dashboard"
version = "1.0.0"
description = "Interactive Streamlit dashboard for exploring sales CSV data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "streamlit>=1.59,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "plotly>=5.24,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["sales_dashboard"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
